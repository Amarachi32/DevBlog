version: '3.8'

services:
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - ATLAS_URI=${ATLAS_URI}
      - PORT=5000
    networks:
      - devblog-network
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devblog-network
    restart: unless-stopped

networks:
  devblog-network:
    driver: bridge